plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.fresheval" // ✅ FIXED: "=" instead of space
    compileSdkVersion 34  // ✅ FIXED: Use explicit SDK version

    defaultConfig {
        applicationId "com.example.fresheval"
        minSdkVersion 21  // ✅ FIXED: Use explicit minSdkVersion
        targetSdkVersion 34  // ✅ FIXED: Use explicit targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    aaptOptions {
        noCompress "tflite"
        noCompress "lite"
    }
}

flutter {
    source = "../.."
}
dependencies {
    implementation project(':flutter_vision') 

    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.0"
    implementation 'androidx.core:core-ktx:1.9.0'
}